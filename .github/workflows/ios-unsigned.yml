name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build for device without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MeshTalk.xcodeproj \
            -scheme "MeshTalk (iOS)" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/bitchat.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/MeshTalk-unsigned.ipa"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 MeshTalk-unsigned.ipa | tee MeshTalk-unsigned.ipa.sha256
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            "ios/build/DerivedData/Build/Products/Release-iphoneos/bitchat.app/Info.plist"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeshTalk-unsigned-ipa
          path: |
            MeshTalk-unsigned.ipa
            MeshTalk-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          if-no-files-found: ignore
          retention-days: 7
