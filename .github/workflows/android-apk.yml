name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build universal debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME set), but sdkmanager
      # is NOT on PATH, so resolve it from $ANDROID_HOME/cmdline-tools/*/bin.
      # Do NOT add android-actions/setup-android@v3 here: it runs `sdkmanager tools`, which now
      # fails with "Failed to find package 'tools'" because that package was removed upstream.
      - name: Install platform and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found under $SDK_ROOT"; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"
          ls "$SDK_ROOT/build-tools/37.0.0" | head

      - name: Build debug APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Verify APK metadata
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-universal-debug.apk
          test -f "$APK"
          ls -lh app/build/outputs/apk/debug/
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/MeshTalk-apk.sha256"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$APK" |
            grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code)" |
            tee "$GITHUB_WORKSPACE/MeshTalk-apk-badging.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshTalk-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-universal-debug.apk
            MeshTalk-apk.sha256
            MeshTalk-apk-badging.txt
          if-no-files-found: error
          retention-days: 14
