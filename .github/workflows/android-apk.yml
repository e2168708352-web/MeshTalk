name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build universal debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Build debug APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Verify APK metadata
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-universal-debug.apk
          test -f "$APK"
          ls -lh app/build/outputs/apk/debug/
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/MeshTalk-apk.sha256"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" |
            grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code)" |
            tee "$GITHUB_WORKSPACE/MeshTalk-apk-badging.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshTalk-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-universal-debug.apk
            MeshTalk-apk.sha256
            MeshTalk-apk-badging.txt
          if-no-files-found: error
          retention-days: 14
